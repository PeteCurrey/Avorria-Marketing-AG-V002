<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <radialGradient id="bgGlow7" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1B1A17" />
      <stop offset="100%" stop-color="#090908" />
    </radialGradient>
    <pattern id="quadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22201D" stroke-width="0.6" />
    </pattern>
    <linearGradient id="compoundingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE7B72" />
      <stop offset="50%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow7)" />
  <rect width="1600" height="900" fill="url(#quadGrid)" opacity="0.45" />

  <!-- Top Metadata Ribbon -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" fill="#BE7B72" font-family="'Work Sans', system-ui, sans-serif" font-size="12" font-weight="300" letter-spacing="4">PHASE 07 // COMPOUNDING TELEMETRY &amp; CONVERSION ITERATION</text>
    <text x="1440" y="0" text-anchor="end" fill="#75726C" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">QUARTERLY CYCLE: COMP-2026-Q4</text>
    <line x1="0" y1="20" x2="1440" y2="20" stroke="#2E2B27" stroke-width="1" />
  </g>

  <!-- Left: Compounding Commercial Growth Curves -->
  <g transform="translate(80, 140)">
    <rect width="780" height="670" rx="3" fill="#141311" stroke="#2E2B27" stroke-width="1" />
    <path d="M 0 0 L 780 0 L 780 48 L 0 48 Z" fill="#1A1916" />
    <circle cx="28" cy="24" r="4" fill="#E0A96D" />
    <text x="44" y="28" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300" letter-spacing="2">COMPOUNDING TRAFFIC &amp; CONVERSION YIELD</text>
    <text x="750" y="28" text-anchor="end" fill="#10B981" font-family="ui-monospace, monospace" font-size="11">+47.8% NET MARGIN</text>
    <line x1="0" y1="48" x2="780" y2="48" stroke="#2E2B27" stroke-width="1" />

    <!-- Chart Visual -->
    <g transform="translate(48, 80)">
      <!-- Axis Lines -->
      <line x1="0" y1="280" x2="684" y2="280" stroke="#2E2B27" stroke-width="1" />
      <line x1="0" y1="210" x2="684" y2="210" stroke="#22201D" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="0" y1="140" x2="684" y2="140" stroke="#22201D" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="0" y1="70" x2="684" y2="70" stroke="#22201D" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Baseline Line -->
      <path d="M 0 250 L 684 220" fill="none" stroke="#504D48" stroke-width="1.5" stroke-dasharray="6 6" />
      <text x="684" y="210" text-anchor="end" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">UNOPTIMIZED SYSTEM (FLAT)</text>

      <!-- Compounding Exponential Curve -->
      <path d="M 0 250 Q 160 230 320 180 T 520 90 T 684 25" fill="none" stroke="url(#compoundingGrad)" stroke-width="3" />
      <path d="M 0 250 Q 160 230 320 180 T 520 90 T 684 25 L 684 280 L 0 280 Z" fill="#10B981" fill-opacity="0.06" />

      <!-- Quarters Markers -->
      <circle cx="0" cy="250" r="4" fill="#BE7B72" />
      <text x="0" y="305" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">Q1 LAUNCH</text>

      <circle cx="228" cy="210" r="4" fill="#E0A96D" />
      <text x="228" y="305" text-anchor="middle" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">Q2 SEARCH EXPANSION</text>

      <circle cx="456" cy="120" r="4" fill="#10B981" />
      <text x="456" y="305" text-anchor="middle" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">Q3 AUTOMATION</text>

      <circle cx="684" cy="25" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
      <text x="684" y="305" text-anchor="end" fill="#10B981" font-family="ui-monospace, monospace" font-size="10">Q4 MARKET LEADERSHIP</text>
    </g>

    <!-- Quarterly Iteration Ledger -->
    <g transform="translate(48, 420)">
      <rect width="684" height="200" fill="#181714" stroke="#262421" stroke-width="1" rx="2" />
      <text x="24" y="32" fill="#EFECE6" font-family="'Work Sans', sans-serif" font-size="12" font-weight="300" letter-spacing="2">MEASURED OPERATIONAL IMPROVEMENT</text>
      
      <g transform="translate(24, 60)">
        <g transform="translate(0, 0)">
          <text x="0" y="20" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">CONVERSION VELOCITY</text>
          <text x="0" y="50" fill="#10B981" font-family="ui-monospace, monospace" font-size="24">+47.8%</text>
          <text x="0" y="75" fill="#A09D97" font-family="'Work Sans', sans-serif" font-size="11">Zero friction checkout</text>
        </g>

        <g transform="translate(220, 0)">
          <text x="0" y="20" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">SEARCH AUTHORITY</text>
          <text x="0" y="50" fill="#E0A96D" font-family="ui-monospace, monospace" font-size="24">94.2/100</text>
          <text x="0" y="75" fill="#A09D97" font-family="'Work Sans', sans-serif" font-size="11">Category index ranking</text>
        </g>

        <g transform="translate(440, 0)">
          <text x="0" y="20" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">SYSTEM RELIABILITY</text>
          <text x="0" y="50" fill="#F0EDE8" font-family="ui-monospace, monospace" font-size="24">99.99%</text>
          <text x="0" y="75" fill="#A09D97" font-family="'Work Sans', sans-serif" font-size="11">Zero downtime recorded</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Automated Telemetry Loop -->
  <g transform="translate(900, 140)">
    <rect width="620" height="670" rx="3" fill="#141311" stroke="#2E2B27" stroke-width="1" />
    <path d="M 0 0 L 620 0 L 620 48 L 0 48 Z" fill="#1A1916" />
    <circle cx="28" cy="24" r="4" fill="#BE7B72" />
    <text x="44" y="28" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300" letter-spacing="2">CONTINUOUS ITERATION CADENCE</text>
    <line x1="0" y1="48" x2="620" y2="48" stroke="#2E2B27" stroke-width="1" />

    <g transform="translate(36, 80)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="548" height="90" fill="#181714" stroke="#2A2724" stroke-width="1" rx="2" />
        <circle cx="28" cy="28" r="8" fill="#1F1D1A" stroke="#BE7B72" stroke-width="1.5" />
        <text x="28" y="32" text-anchor="middle" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="10">01</text>
        <text x="48" y="32" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">Continuous Real User Telemetry (RUM)</text>
        <text x="48" y="58" fill="#75726C" font-family="'Work Sans', sans-serif" font-size="11">Passive tracking of edge response latencies and interaction drops.</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 110)">
        <rect width="548" height="90" fill="#181714" stroke="#2A2724" stroke-width="1" rx="2" />
        <circle cx="28" cy="28" r="8" fill="#1F1D1A" stroke="#E0A96D" stroke-width="1.5" />
        <text x="28" y="32" text-anchor="middle" fill="#E0A96D" font-family="ui-monospace, monospace" font-size="10">02</text>
        <text x="48" y="32" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">Quarterly Search Dominance Expansions</text>
        <text x="48" y="58" fill="#75726C" font-family="'Work Sans', sans-serif" font-size="11">Expanding topic graph clusters to capture emerging high-intent queries.</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 220)">
        <rect width="548" height="90" fill="#181714" stroke="#2A2724" stroke-width="1" rx="2" />
        <circle cx="28" cy="28" r="8" fill="#1F1D1A" stroke="#10B981" stroke-width="1.5" />
        <text x="28" y="32" text-anchor="middle" fill="#10B981" font-family="ui-monospace, monospace" font-size="10">03</text>
        <text x="48" y="32" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">Algorithmic Conversion Tuning</text>
        <text x="48" y="58" fill="#75726C" font-family="'Work Sans', sans-serif" font-size="11">Iterative refinement of form flows, checkout stages, and value props.</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 330)">
        <rect width="548" height="90" fill="#181714" stroke="#2A2724" stroke-width="1" rx="2" />
        <circle cx="28" cy="28" r="8" fill="#1F1D1A" stroke="#3B82F6" stroke-width="1.5" />
        <text x="28" y="32" text-anchor="middle" fill="#3B82F6" font-family="ui-monospace, monospace" font-size="10">04</text>
        <text x="48" y="32" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">Infrastructure Cost &amp; Speed Compounding</text>
        <text x="48" y="58" fill="#75726C" font-family="'Work Sans', sans-serif" font-size="11">Continual cache layer tuning to drive bandwidth and compute overhead to zero.</text>
      </g>
    </g>
  </g>
</svg>
