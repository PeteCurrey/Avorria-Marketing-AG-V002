<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1B1917" />
      <stop offset="100%" stop-color="#0B0B0A" />
    </radialGradient>
    <pattern id="gridPattern2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22201D" stroke-width="0.7" />
      <circle cx="0" cy="0" r="1" fill="#383530" />
    </pattern>
    <linearGradient id="busLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE7B72" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#BE7B72" />
      <stop offset="100%" stop-color="#EFECE6" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow2)" />
  <rect width="1600" height="900" fill="url(#gridPattern2)" opacity="0.5" />

  <!-- Top Metadata Ribbon -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" fill="#BE7B72" font-family="'Work Sans', system-ui, sans-serif" font-size="12" font-weight="300" letter-spacing="4">PHASE 02 // SERVICE TOPOLOGY &amp; RELATIONAL SCHEMA SPECIFICATION</text>
    <text x="1440" y="0" text-anchor="end" fill="#75726C" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">ENGINEERING BLUEPRINT: ARCH-2026-v2</text>
    <line x1="0" y1="20" x2="1440" y2="20" stroke="#2E2B27" stroke-width="1" />
  </g>

  <!-- Central System Architecture Diagram -->
  <!-- Left Schema Box: Client Session & Identity -->
  <g transform="translate(80, 160)">
    <rect width="360" height="340" fill="#141311" stroke="#2E2B27" stroke-width="1" rx="2" />
    <path d="M 0 0 L 360 0 L 360 40 L 0 40 Z" fill="#1C1A17" />
    <circle cx="20" cy="20" r="4" fill="#BE7B72" />
    <text x="36" y="24" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="12" font-weight="300" letter-spacing="1.5">TABLE: auth.sessions</text>
    <text x="340" y="24" text-anchor="end" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">RLS: STRICT</text>
    <line x1="0" y1="40" x2="360" y2="40" stroke="#2E2B27" stroke-width="1" />

    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11">
      <text x="0" y="20" fill="#BE7B72">id: uuid [PK]</text>
      <text x="0" y="50" fill="#A09D97">org_id: uuid [FK -> orgs.id]</text>
      <text x="0" y="80" fill="#A09D97">session_token_hash: bytea</text>
      <text x="0" y="110" fill="#A09D97">client_ip_hash: text</text>
      <text x="0" y="140" fill="#A09D97">state: enum_lifecycle</text>
      <text x="0" y="170" fill="#A09D97">created_at: timestamptz</text>
      <text x="0" y="200" fill="#A09D97">metadata: jsonb</text>
      <text x="0" y="235" fill="#75726C">// Zero plain-text persistence</text>
    </g>
  </g>

  <!-- Center Schema Box: Enterprise Project Intelligence -->
  <g transform="translate(560, 160)">
    <rect width="460" height="340" fill="#141311" stroke="#BE7B72" stroke-width="1" rx="2" />
    <path d="M 0 0 L 460 0 L 460 40 L 0 40 Z" fill="#201E1B" />
    <circle cx="20" cy="20" r="4" fill="#BE7B72" />
    <text x="36" y="24" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="12" font-weight="300" letter-spacing="1.5">TABLE: discovery.intelligence_core</text>
    <text x="440" y="24" text-anchor="end" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="10">CORE ENGINE</text>
    <line x1="0" y1="40" x2="460" y2="40" stroke="#BE7B72" stroke-width="1" stroke-opacity="0.4" />

    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11">
      <text x="0" y="20" fill="#BE7B72">id: uuid [PK]</text>
      <text x="0" y="50" fill="#F0EDE8">session_id: uuid [FK -> auth.sessions]</text>
      <text x="0" y="80" fill="#A09D97">completeness_matrix: jsonb</text>
      <text x="0" y="110" fill="#A09D97">ontology_embedding: vector(1536)</text>
      <text x="0" y="140" fill="#A09D97">provenance_tree: jsonb [Immutable]</text>
      <text x="0" y="170" fill="#A09D97">validation_state: enum_audit</text>
      <text x="0" y="200" fill="#A09D97">client_brief_version: integer</text>
      <text x="0" y="235" fill="#BE7B72">// Deterministic state transition engine</text>
    </g>
  </g>

  <!-- Right Schema Box: Microservice Contracts & Event Bus -->
  <g transform="translate(1140, 160)">
    <rect width="380" height="340" fill="#141311" stroke="#2E2B27" stroke-width="1" rx="2" />
    <path d="M 0 0 L 380 0 L 380 40 L 0 40 Z" fill="#1C1A17" />
    <circle cx="20" cy="20" r="4" fill="#EFECE6" />
    <text x="36" y="24" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="12" font-weight="300" letter-spacing="1.5">SERVICE: api.telemetry_bridge</text>
    <text x="360" y="24" text-anchor="end" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">SUB-10MS</text>
    <line x1="0" y1="40" x2="380" y2="40" stroke="#2E2B27" stroke-width="1" />

    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11">
      <text x="0" y="20" fill="#EFECE6">endpoint: /v2/pipeline/stream</text>
      <text x="0" y="50" fill="#A09D97">protocol: gRPC / HTTP2 Multiplex</text>
      <text x="0" y="80" fill="#A09D97">cache_strategy: stale-while-revalidate</text>
      <text x="0" y="110" fill="#A09D97">edge_regions: ['lhr1', 'fra1', 'iad1']</text>
      <text x="0" y="140" fill="#A09D97">rate_limit: sliding_window(60s)</text>
      <text x="0" y="170" fill="#A09D97">idempotency_key: sha256_header</text>
      <text x="0" y="205" fill="#75726C">// Strict TLS 1.3 encrypted conduits</text>
    </g>
  </g>

  <!-- Connective Arrows & Data Bus Lines -->
  <path d="M 440 230 L 560 230" stroke="url(#busLine)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="500" cy="230" r="3" fill="#BE7B72" />
  <text x="500" y="215" text-anchor="middle" fill="#75726C" font-family="ui-monospace, monospace" font-size="9">FOREIGN KEY (1:N)</text>

  <path d="M 1020 230 L 1140 230" stroke="url(#busLine)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="1080" cy="230" r="3" fill="#BE7B72" />
  <text x="1080" y="215" text-anchor="middle" fill="#75726C" font-family="ui-monospace, monospace" font-size="9">EVENT DISPATCH</text>

  <!-- Bottom Architecture Stack Spec -->
  <g transform="translate(80, 560)">
    <rect width="1440" height="240" fill="#141311" stroke="#2E2B27" stroke-width="1" rx="2" />
    <path d="M 0 0 L 1440 0 L 1440 36 L 0 36 Z" fill="#1A1916" />
    <text x="24" y="22" fill="#BE7B72" font-family="'Work Sans', sans-serif" font-size="11" letter-spacing="2">ARCHITECTURAL BOUNDARIES &amp; INTEGRATION MATRIX</text>
    
    <g transform="translate(24, 60)">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="20" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">EDGE RUNTIME</text>
        <text x="0" y="44" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">Next.js Server Actions</text>
        <text x="0" y="66" fill="#A09D97" font-family="'Work Sans', sans-serif" font-size="11">Sub-second SSR rendering</text>
        <text x="0" y="86" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="10">LATENCY: &lt; 45ms</text>
      </g>
      
      <!-- Col 2 -->
      <g transform="translate(360, 0)">
        <text x="0" y="20" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">PERSISTENCE</text>
        <text x="0" y="44" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">PostgreSQL 16 Cluster</text>
        <text x="0" y="66" fill="#A09D97" font-family="'Work Sans', sans-serif" font-size="11">Connection pooling &amp; row-level security</text>
        <text x="0" y="86" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="10">CONCURRENCY: 10K TPS</text>
      </g>

      <!-- Col 3 -->
      <g transform="translate(740, 0)">
        <text x="0" y="20" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">STATE MACHINE</text>
        <text x="0" y="44" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">Strict Provenance Engine</text>
        <text x="0" y="66" fill="#A09D97" font-family="'Work Sans', sans-serif" font-size="11">Contradiction detection &amp; audit logging</text>
        <text x="0" y="86" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="10">DETERMINISTIC FALLBACK: 100%</text>
      </g>

      <!-- Col 4 -->
      <g transform="translate(1100, 0)">
        <text x="0" y="20" fill="#75726C" font-family="ui-monospace, monospace" font-size="10">INTEGRATION CONDUIT</text>
        <text x="0" y="44" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">Bi-directional Webhooks</text>
        <text x="0" y="66" fill="#A09D97" font-family="'Work Sans', sans-serif" font-size="11">Signed SHA-256 payload verification</text>
        <text x="0" y="86" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="10">ZERO DROP POLICY</text>
      </g>
    </g>
  </g>
</svg>
