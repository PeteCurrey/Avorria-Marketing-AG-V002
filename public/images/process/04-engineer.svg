    <text x="0" y="0" fill="#BE7B72" font-family="'Work Sans', system-ui, sans-serif" font-size="12" font-weight="300" letter-spacing="4">PHASE 04 // FULL-STACK REPOSITORY &amp; TYPED CONTRACT PIPELINE</text>
    <text x="1440" y="0" text-anchor="end" fill="#75726C" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">NEXT.JS 16 // APP ROUTER // STRICT TYPESCRIPT</text>
    <line x1="0" y1="20" x2="1440" y2="20" stroke="#2E2B27" stroke-width="1" />
  </g>

  <!-- Left: Production IDE Code Window -->
  <g transform="translate(80, 140)">
    <rect width="860" height="670" rx="3" fill="#131210" stroke="#2E2B27" stroke-width="1" />
    
    <!-- Titlebar -->
    <path d="M 0 0 L 860 0 L 860 48 L 0 48 Z" fill="#1A1916" />
    <circle cx="24" cy="24" r="4.5" fill="#EF4444" opacity="0.8" />
