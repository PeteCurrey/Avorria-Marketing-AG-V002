    <circle cx="60" cy="24" r="4.5" fill="#10B981" opacity="0.8" />
    <text x="96" y="28" fill="#F0EDE8" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">lib/actions/discovery.ts — strict-mode</text>
    <text x="830" y="28" text-anchor="end" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="10">SERVER-ONLY</text>
    <line x1="0" y1="48" x2="860" y2="48" stroke="#2E2B27" stroke-width="1" />

    <!-- Code Editor Content -->
    <g transform="translate(36, 80)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" line-height="24">
      <text x="0" y="20" fill="#75726C">01</text>
      <text x="35" y="20" fill="#BE7B72">'use server'</text>

      <text x="0" y="48" fill="#75726C">02</text>
      <text x="35" y="48" fill="#75726C">// Zero-compromise deterministic pipeline</text>

      <text x="0" y="76" fill="#75726C">03</text>
      <text x="35" y="76"><tspan fill="#BE7B72">import</tspan><tspan fill="#F0EDE8"> { z } </tspan><tspan fill="#BE7B72">from</tspan><tspan fill="#A09D97"> 'zod'</tspan></text>

      <text x="0" y="104" fill="#75726C">04</text>
      <text x="35" y="104"><tspan fill="#BE7B72">import</tspan><tspan fill="#F0EDE8"> { type </tspan><tspan fill="#E0A96D">DiscoveryProjectRow</tspan><tspan fill="#F0EDE8"> } </tspan><tspan fill="#BE7B72">from</tspan><tspan fill="#A09D97"> '@/lib/db/discovery'</tspan></text>

      <text x="0" y="132" fill="#75726C">05</text>
      <text x="35" y="132"><tspan fill="#BE7B72">import</tspan><tspan fill="#F0EDE8"> { </tspan><tspan fill="#E0A96D">evaluateCompleteness</tspan><tspan fill="#F0EDE8"> } </tspan><tspan fill="#BE7B72">from</tspan><tspan fill="#A09D97"> '@/lib/ai/openai'</tspan></text>

      <text x="0" y="160" fill="#75726C">06</text>

      <text x="0" y="188" fill="#75726C">07</text>
      <text x="35" y="188"><tspan fill="#BE7B72">export async function</tspan><tspan fill="#F0EDE8"> saveStageAnswerAction(</tspan></text>

      <text x="0" y="216" fill="#75726C">08</text>
      <text x="55" y="216"><tspan fill="#F0EDE8">payload: </tspan><tspan fill="#E0A96D">StageAnswerPayload</tspan></text>

      <text x="0" y="244" fill="#75726C">09</text>
      <text x="35" y="244"><tspan fill="#F0EDE8">): </tspan><tspan fill="#E0A96D">Promise</tspan><tspan fill="#F0EDE8">&lt;</tspan><tspan fill="#E0A96D">StageAnswerResult</tspan><tspan fill="#F0EDE8">&gt; {</tspan></text>

      <text x="0" y="272" fill="#75726C">10</text>
      <text x="55" y="272"><tspan fill="#BE7B72">const</tspan><tspan fill="#F0EDE8"> project = </tspan><tspan fill="#BE7B72">await</tspan><tspan fill="#F0EDE8"> getDiscoveryProjectByToken(payload.token)</tspan></text>

      <text x="0" y="300" fill="#75726C">11</text>
      <text x="55" y="300"><tspan fill="#BE7B72">if</tspan><tspan fill="#F0EDE8"> (!project) </tspan><tspan fill="#BE7B72">throw new</tspan><tspan fill="#E0A96D"> SessionNotFoundError</tspan><tspan fill="#F0EDE8">()</tspan></text>

      <text x="0" y="328" fill="#75726C">12</text>

      <text x="0" y="356" fill="#75726C">13</text>
      <text x="55" y="356"><tspan fill="#75726C">// Non-blocking progressive intelligence extraction</tspan></text>

      <text x="0" y="384" fill="#75726C">14</text>
      <text x="55" y="384"><tspan fill="#BE7B72">const</tspan><tspan fill="#F0EDE8"> completeness = </tspan><tspan fill="#BE7B72">await</tspan><tspan fill="#F0EDE8"> evaluateCompleteness(project.answers)</tspan></text>

      <text x="0" y="412" fill="#75726C">15</text>
      <text x="55" y="412"><tspan fill="#BE7B72">return</tspan><tspan fill="#F0EDE8"> { success: </tspan><tspan fill="#10B981">true</tspan><tspan fill="#F0EDE8">, completeness, latencyMs: </tspan><tspan fill="#BE7B72">42</tspan><tspan fill="#F0EDE8"> }</tspan></text>

      <text x="0" y="440" fill="#75726C">16</text>
      <text x="35" y="440" fill="#F0EDE8">}</text>
    </g>

