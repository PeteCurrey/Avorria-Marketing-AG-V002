      <stop offset="0%" stop-color="#1A1816" />
      <stop offset="100%" stop-color="#0A0A09" />
    </radialGradient>
    <pattern id="codeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F1D1B" stroke-width="0.5" />
