<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#191816" />
      <stop offset="100%" stop-color="#0C0C0B" />
    </radialGradient>
    <pattern id="rulerGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22201D" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow3)" />
  <rect width="1600" height="900" fill="url(#rulerGrid)" opacity="0.4" />

  <!-- Top Metadata Ribbon -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" fill="#BE7B72" font-family="'Work Sans', system-ui, sans-serif" font-size="12" font-weight="300" letter-spacing="4">PHASE 03 // DESIGN TOKENS &amp; INTERACTIVE COMPOSITION</text>
    <text x="1440" y="0" text-anchor="end" fill="#75726C" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">SWISS DESIGN SPEC: TOKENS-2026-v1</text>
    <line x1="0" y1="20" x2="1440" y2="20" stroke="#2E2B27" stroke-width="1" />
  </g>

  <!-- Left: Typography Specimen & Weight Hierarchy (Zero Bold Rule) -->
  <g transform="translate(80, 150)">
    <rect width="700" height="660" rx="3" fill="#141311" stroke="#2E2B27" stroke-width="1" />
    <path d="M 0 0 L 700 0 L 700 48 L 0 48 Z" fill="#1A1916" />
    <circle cx="28" cy="24" r="4" fill="#BE7B72" />
    <text x="44" y="28" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300" letter-spacing="2">TYPOGRAPHY HIERARCHY — WORK SANS ONLY</text>
    <text x="670" y="28" text-anchor="end" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="11">RULE: NO WEIGHT &gt; 300</text>
    <line x1="0" y1="48" x2="700" y2="48" stroke="#2E2B27" stroke-width="1" />

    <!-- Specimen Rows -->
    <g transform="translate(40, 80)">
      <!-- H1 Specimen -->
      <text x="0" y="20" fill="#75726C" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">H1 DISPLAY // WEIGHT 200 (EXTRA LIGHT) // -0.03EM TRACKING</text>
      <text x="0" y="80" fill="#F7F5F0" font-family="'Work Sans', sans-serif" font-size="52" font-weight="200" letter-spacing="-1.5">Monolithic Precision.</text>
      <line x1="0" y1="110" x2="620" y2="110" stroke="#2A2724" stroke-width="1" />

      <!-- H2 Specimen -->
      <text x="0" y="145" fill="#75726C" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">H2 SECTION TITLE // WEIGHT 200 (EXTRA LIGHT) // -0.02EM TRACKING</text>
      <text x="0" y="195" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="34" font-weight="200">Architectural systems built to compound.</text>
      <line x1="0" y1="225" x2="620" y2="225" stroke="#2A2724" stroke-width="1" />

      <!-- Body Specimen -->
      <text x="0" y="260" fill="#75726C" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">BODY COPY // WEIGHT 300 (LIGHT) // 1.625 LINE-HEIGHT</text>
      <text x="0" y="295" fill="#C0BCB4" font-family="'Work Sans', sans-serif" font-size="16" font-weight="300">Hierarchy from scale, tracking, line-height, rules, and spacing only.</text>
      <text x="0" y="325" fill="#8A8782" font-family="'Work Sans', sans-serif" font-size="15" font-weight="300">Every design token is codified into strict CSS custom properties.</text>
      <line x1="0" y1="360" x2="620" y2="360" stroke="#2A2724" stroke-width="1" />

      <!-- Micro / Telemetry Specimen -->
      <text x="0" y="395" fill="#75726C" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">TELEMETRY &amp; METADATA // UI-MONOSPACE // 0.18EM TRACKING</text>
      <text x="0" y="430" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3">STATUS: COMPILED // 0.000 CLS // WCAG AAA PASSED</text>
    </g>

    <!-- Calibration Footer -->
    <g transform="translate(40, 560)">
      <rect width="620" height="50" fill="#1C1A17" stroke="#2E2B27" stroke-width="1" rx="2" />
      <text x="24" y="30" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="11">CI GUARD: STRICT ENFORCEMENT // 0 WEIGHT VIOLATIONS ALLOWED</text>
    </g>
  </g>

  <!-- Right: Restrained Palette Tokens & Layout Ruler Grid -->
  <g transform="translate(820, 150)">
    <rect width="700" height="660" rx="3" fill="#141311" stroke="#2E2B27" stroke-width="1" />
    <path d="M 0 0 L 700 0 L 700 48 L 0 48 Z" fill="#1A1916" />
    <circle cx="28" cy="24" r="4" fill="#EFECE6" />
    <text x="44" y="28" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300" letter-spacing="2">COLOR SYSTEM &amp; SPATIAL SCALE</text>
    <line x1="0" y1="48" x2="700" y2="48" stroke="#2E2B27" stroke-width="1" />

    <!-- Color Swatches Grid -->
    <g transform="translate(40, 80)">
      <text x="0" y="0" fill="#75726C" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">EDITORIAL PALETTE PRIMITIVES</text>

      <!-- Swatch 1: Obsidian -->
      <g transform="translate(0, 25)">
        <rect width="135" height="85" fill="#121110" stroke="#33302B" stroke-width="1" rx="2" />
        <rect x="0" y="60" width="135" height="25" fill="#181715" />
        <text x="10" y="77" fill="#F0EDE8" font-family="ui-monospace, monospace" font-size="10">#121110</text>
        <text x="10" y="40" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="11" font-weight="300">Obsidian</text>
      </g>

      <!-- Swatch 2: Graphite -->
      <g transform="translate(160, 25)">
        <rect width="135" height="85" fill="#1E1C19" stroke="#33302B" stroke-width="1" rx="2" />
        <rect x="0" y="60" width="135" height="25" fill="#24221F" />
        <text x="10" y="77" fill="#F0EDE8" font-family="ui-monospace, monospace" font-size="10">#1E1C19</text>
        <text x="10" y="40" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="11" font-weight="300">Graphite</text>
      </g>

      <!-- Swatch 3: Rose Accent -->
      <g transform="translate(320, 25)">
        <rect width="135" height="85" fill="#BE7B72" rx="2" />
        <rect x="0" y="60" width="135" height="25" fill="#9C625A" />
        <text x="10" y="77" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="10">#BE7B72</text>
        <text x="10" y="40" fill="#FFFFFF" font-family="'Work Sans', sans-serif" font-size="11" font-weight="300">Warm Rose</text>
      </g>

      <!-- Swatch 4: Paper -->
      <g transform="translate(480, 25)">
        <rect width="135" height="85" fill="#FAF8F5" rx="2" />
        <rect x="0" y="60" width="135" height="25" fill="#EDE9E3" />
        <text x="10" y="77" fill="#121110" font-family="ui-monospace, monospace" font-size="10">#FAF8F5</text>
        <text x="10" y="40" fill="#121110" font-family="'Work Sans', sans-serif" font-size="11" font-weight="300">Fine Paper</text>
      </g>
    </g>

    <!-- Spatial Dimension Grid & Golden Ratio Layout -->
    <g transform="translate(40, 240)">
      <text x="0" y="0" fill="#75726C" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">GOLDEN RATIO SPATIAL CADENCE (1.618)</text>

      <g transform="translate(0, 25)">
        <rect width="620" height="220" fill="#181714" stroke="#2E2B27" stroke-width="1" rx="2" />
        
        <!-- Golden Ratio Rectangles -->
        <rect x="20" y="20" width="360" height="180" fill="#141311" stroke="#BE7B72" stroke-width="1" />
        <text x="35" y="45" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="11">MAJOR HERO // 61.8%</text>
        
        <rect x="400" y="20" width="200" height="180" fill="#141311" stroke="#383530" stroke-width="1" />
        <text x="415" y="45" fill="#A09D97" font-family="ui-monospace, monospace" font-size="11">TELEMETRY // 38.2%</text>

        <!-- Dynamic Rule Measurements -->
        <line x1="20" y1="120" x2="380" y2="120" stroke="#BE7B72" stroke-width="0.5" stroke-dasharray="2 2" />
        <text x="200" y="115" text-anchor="middle" fill="#BE7B72" font-family="ui-monospace, monospace" font-size="9">7vw GUTTER ALIGNMENT</text>
      </g>
    </g>

    <!-- Accessibility Verification -->
    <g transform="translate(40, 520)">
      <rect width="620" height="90" fill="#1A1916" stroke="#2E2B27" stroke-width="1" rx="2" />
      <g transform="translate(20, 20)">
        <circle cx="10" cy="10" r="4" fill="#10B981" />
        <text x="25" y="14" fill="#F0EDE8" font-family="'Work Sans', sans-serif" font-size="13" font-weight="300">WCAG AAA Contrast Validated</text>
        <text x="25" y="40" fill="#8A8782" font-family="'Work Sans', sans-serif" font-size="11">All text elements strictly exceed 7:1 contrast ratio against backdrops.</text>
        <text x="580" y="25" text-anchor="end" fill="#10B981" font-family="ui-monospace, monospace" font-size="13">PASS (14.2:1)</text>
      </g>
    </g>
  </g>
</svg>
